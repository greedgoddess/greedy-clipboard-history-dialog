# Continuous integration: syntax, ShellCheck, unit tests, and building and
# checking the newest tested release. All of it runs without GNOME.
#
# The smoke test, which loads the extension in GNOME Shell, is not run here:
# GNOME Shell needs a real desktop session, which a CI container does not
# have, and replacing the missing services with stand-ins is not a test
# ground this project relies on. It runs on a GNOME desktop instead, and
# update-test-and-push.sh records a release as tested only when it passes.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build-info.json records the feature commit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libglib2.0-bin zip
      - name: Syntax
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          for f in *.sh scripts/*.sh tests/*.sh; do bash -n "$f"; done
          for f in feature/*.js; do cp "$f" /tmp/check.mjs; node --check /tmp/check.mjs; done
          for f in feature/settings-keys.xml; do python3 -c "import sys, xml.etree.ElementTree as E; E.fromstring('<s>' + open(sys.argv[1]).read() + '</s>')" "$f"; done
      - name: ShellCheck
        run: shellcheck -x --severity=error *.sh scripts/*.sh tests/*.sh
      - name: Unit tests
        run: tests/run-tests.sh --unit-only
      - name: Build the newest tested release and check it
        run: ./build.sh && python3 tests/check_build.py

