# Continuous integration. "checks" must pass.
#
# "smoke-test" loads the extension in a real GNOME Shell, inside a Fedora
# container. A container is a headless system without the services a desktop
# starts at boot, so GNOME Shell may not start there; the job is allowed to
# fail without failing the whole run, and its result is shown as it is.
#
# Services the job provides, and whether they are real:
#   - system D-Bus: real (the same dbus-daemon every Linux system runs; a
#     container just does not start it). GNOME Shell connects to it at
#     startup, for example for its screen-time limits.
#   - nothing is replaced by a stand-in.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build-info.json records the feature commit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libglib2.0-bin zip
      - name: Syntax
        run: |
          python3 -m py_compile scripts/*.py tests/*.py
          for f in *.sh scripts/*.sh tests/*.sh; do bash -n "$f"; done
          for f in feature/*.js; do cp "$f" /tmp/check.mjs; node --check /tmp/check.mjs; done
          for f in feature/settings-keys.xml; do python3 -c "import sys, xml.etree.ElementTree as E; E.fromstring('<s>' + open(sys.argv[1]).read() + '</s>')" "$f"; done
      - name: ShellCheck
        run: shellcheck -x --severity=error *.sh scripts/*.sh tests/*.sh
      - name: Unit tests
        run: tests/run-tests.sh --unit-only
      - name: Build the newest tested release and check it
        run: ./build.sh && python3 tests/check_build.py

  smoke-test:
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: fedora:45
    steps:
      - name: Tools
        run: dnf install -y --setopt=install_weak_deps=False git gnome-shell dbus-daemon python3 zip glib2 /usr/bin/gresource mesa-dri-drivers
      - name: Start the system D-Bus (real, not a stand-in)
        run: |
          dbus-uuidgen --ensure=/etc/machine-id
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build and smoke test on GNOME Shell from Fedora 45
        run: |
          git config --global --add safe.directory "$PWD"
          ./build.sh
          # Here, unlike in "checks", GNOME Shell is installed, so the build
          # must have checked the GNOME Shell internals the feature relies on.
          grep -q 'Internals check: *checked' build/BUILD-INFO
          tests/smoke-test.sh
